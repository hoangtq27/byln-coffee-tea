services:
  - type: web
    name: byln-coffee-tea-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # dán chuỗi kết nối Neon
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # URL Vercel của frontend
